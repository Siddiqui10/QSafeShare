<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSafeShare — Secure File Access</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .share-container {
      max-width: 620px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    .share-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), var(--shadow-glow);
    }
    .share-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .file-preview-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .file-icon-large {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .verification-steps {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    @media (max-width: 640px) {
      .share-container {
        margin: 1.25rem auto 2rem auto;
        padding: 0 0.85rem;
      }
      .share-box {
        padding: 1.25rem 1rem;
        border-radius: var(--radius-md);
      }
      .share-header {
        margin-bottom: 1.25rem;
      }
      .share-header h2 {
        font-size: 1.25rem !important;
      }
      .file-preview-card {
        padding: 0.85rem;
        gap: 0.75rem;
      }
      .file-icon-large {
        width: 40px;
        height: 40px;
        font-size: 1.25rem;
      }
      header {
        padding: 0.75rem 1rem !important;
      }
      .header-container {
        gap: 0.5rem;
      }
      .brand-title {
        font-size: 1.15rem;
      }
      .brand-badge {
        display: none;
      }
      .btn-sm {
        font-size: 0.75rem;
        padding: 0.35rem 0.65rem;
      }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <a href="/" style="text-decoration:none; display:flex; align-items:center; gap:0.75rem;">
          <div class="brand-icon">⚛️</div>
          <div>
            <span class="brand-title">QSafeShare</span>
            <span class="brand-badge">NIST FIPS 203</span>
          </div>
        </a>
      </div>
      <div>
        <a href="/" class="btn btn-secondary btn-sm">Workspace Dashboard →</a>
      </div>
    </div>
  </header>

  <main class="share-container">
    <div class="share-box" id="shareBoxContainer">
      <div style="text-align:center; padding:2rem;">
        <div style="font-size:2rem; margin-bottom:1rem;">⏳</div>
        <p style="color:var(--pqc-cyan);">Loading secure link metadata...</p>
      </div>
    </div>
  </main>

  <script>
    const shareToken = window.location.pathname.split("/share/")[1]?.split("?")[0]?.split("#")[0];

    // Check if bundle or key is passed in URL fragment (e.g. #b=... or #key=...)
    let fragmentBundle = "";
    let fragmentKey = "";
    if (window.location.hash) {
      const hashContent = window.location.hash.startsWith("#") ? window.location.hash.substring(1) : window.location.hash;
      const urlParams = new URLSearchParams(hashContent);
      if (urlParams.get("b")) {
        fragmentBundle = urlParams.get("b");
      }
      if (urlParams.get("key")) {
        fragmentKey = urlParams.get("key");
      }
    }

    let isStatelessMode = false;
    let currentLinkInfo = null;

    document.addEventListener("DOMContentLoaded", async () => {
      await loadLinkInfo();
    });

    async function loadLinkInfo() {
      const container = document.getElementById("shareBoxContainer");
      try {
        // 1. Try server database lookup
        if (shareToken) {
          const res = await fetch(`/api/links/${shareToken}/info`);
          if (res.ok) {
            const info = await res.json();
            currentLinkInfo = info;
            isStatelessMode = false;
            renderLinkPage(info);
            return;
          }
        }

        // 2. If server database does not have the link (e.g. serverless container cold start),
        // inspect the self-healing link bundle in URL fragment
        if (fragmentBundle) {
          const bRes = await fetch("/api/links/inspect-bundle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ bundle: fragmentBundle }),
          });
          if (bRes.ok) {
            const bInfo = await bRes.json();
            currentLinkInfo = bInfo;
            isStatelessMode = true;
            renderLinkPage(bInfo);
            return;
          } else {
            const bErr = await bRes.json();
            renderError(bErr.detail || "This secure sharing link is invalid or corrupted.");
            return;
          }
        }

        renderError("Secure sharing link not found or expired.");
      } catch (err) {
        if (fragmentBundle) {
          try {
            const bRes = await fetch("/api/links/inspect-bundle", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ bundle: fragmentBundle }),
            });
            if (bRes.ok) {
              const bInfo = await bRes.json();
              currentLinkInfo = bInfo;
              isStatelessMode = true;
              renderLinkPage(bInfo);
              return;
            }
          } catch (_) {}
        }
        renderError(err.message || "Failed to load secure link.");
      }
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const k = 1024;
      const sizes = ["Bytes", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    function renderError(message) {
      const container = document.getElementById("shareBoxContainer");
      container.innerHTML = `
        <div style="text-align:center; padding:1.5rem;">
          <div style="font-size:3rem; margin-bottom:0.75rem;">🚫</div>
          <h3 style="color:var(--accent-rose); margin-bottom:0.5rem;">Secure Access Denied</h3>
          <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">${message}</p>
          <a href="/" class="btn btn-secondary">Return to QSafeShare</a>
        </div>
      `;
    }

    function renderLinkPage(info) {
      const container = document.getElementById("shareBoxContainer");

      if (!info.is_valid) {
        renderError(`Access Denied: ${info.reason}`);
        return;
      }

      const isMlkem = info.protection_mode === "ML_KEM";

      let headerHtml = "";
      let formContentHtml = "";
      let badgeHtml = "";

      if (isMlkem) {
        headerHtml = `
          <div class="share-header">
            <h2 style="font-size:1.35rem; font-weight:700; margin-bottom:0.25rem;">⚛️ Post-Quantum Protected File</h2>
            <p style="font-size:0.8rem; color:var(--text-dim);">Protected with NIST FIPS 203 ML-KEM-768 Lattice Cryptography</p>
          </div>
        `;
        badgeHtml = `<span class="badge badge-pqc" style="font-size:0.68rem;">AES-256-GCM + ${info.kem_algorithm || 'ML-KEM-768'}</span>`;
        formContentHtml = `
          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
              <label style="font-size:0.82rem; font-weight:600; color:var(--text-main); margin-bottom:0;">
                🔐 Post-Quantum ML-KEM-768 Private Key
              </label>
              <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('keyFileInput').click()" style="font-size:0.75rem; padding:0.2rem 0.5rem;">
                📁 Upload .pem File
              </button>
              <input type="file" id="keyFileInput" style="display:none;" accept=".pem,.key,.txt" onchange="handleKeyFileSelect(event)">
            </div>
            <textarea id="credentialInput" class="form-control" rows="5" style="font-family:var(--font-mono); font-size:0.75rem;" placeholder="-----BEGIN PRIVATE KEY-----&#10;Paste recipient's NIST ML-KEM-768 private key block here...&#10;-----END PRIVATE KEY-----" required>${escapeHtml(fragmentKey)}</textarea>
            <div style="font-size:0.72rem; color:var(--text-dim); margin-top:0.35rem;">
              Paste your ML-KEM-768 private key or upload the key file provided with the link.
            </div>
          </div>
        `;
      } else {
        // Password Protected File Sharing (Option 1)
        headerHtml = `
          <div class="share-header">
            <div style="font-size:2.5rem; margin-bottom:0.5rem;">🔒</div>
            <h2 style="font-size:1.35rem; font-weight:700; margin-bottom:0.25rem;">Password-Protected File</h2>
            <p style="font-size:0.82rem; color:var(--text-dim);">Enter the password set by the sender to unlock and download this file</p>
          </div>
        `;
        badgeHtml = `<span class="badge badge-allowed" style="font-size:0.75rem;">🔑 Password Protected</span>`;
        formContentHtml = `
          <div class="form-group">
            <label style="font-size:0.85rem; font-weight:600; color:var(--text-main); margin-bottom:0.4rem; display:block;">
              🔑 File Password
            </label>
            <div style="position:relative; display:flex; align-items:center;">
              <input type="password" id="credentialInput" class="form-control" style="font-family:var(--font-mono); font-size:1rem; padding-right:3rem;" placeholder="Enter file password..." value="${escapeHtml(fragmentKey)}" required autocomplete="current-password">
              <button type="button" onclick="togglePasswordVisibility()" style="position:absolute; right:0.75rem; background:none; border:none; color:var(--text-dim); cursor:pointer; font-size:1.15rem; padding:0.2rem;" title="Show or hide password">
                👁️
              </button>
            </div>
            <div style="font-size:0.74rem; color:var(--text-dim); margin-top:0.4rem;">
              💡 Enter the exact password shared with you by the file owner.
            </div>
          </div>
        `;
      }

      container.innerHTML = `
        ${headerHtml}

        <div class="file-preview-card">
          <div class="file-icon-large">📄</div>
          <div style="flex-grow:1; min-width:0;">
            <div style="font-weight:700; font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
              ${escapeHtml(info.filename)}
            </div>
            <div style="font-size:0.78rem; color:var(--text-dim); display:flex; gap:0.75rem; margin-top:0.35rem; align-items:center;">
              <span>Size: ${formatBytes(info.file_size)}</span>
              <span>•</span>
              ${badgeHtml}
            </div>
          </div>
        </div>

        <form id="decryptLinkForm">
          ${formContentHtml}

          <div id="decryptStatusArea"></div>

          <button type="submit" id="btnDecryptDownload" class="btn btn-primary" style="width:100%; padding:0.8rem; font-size:0.95rem; font-weight:600; margin-top:0.5rem;">
            ${isMlkem ? '🔓 Decrypt & Download File' : '🔓 Unlock & Download File'}
          </button>
        </form>
      `;

      document.getElementById("decryptLinkForm").addEventListener("submit", (e) => handleDecryptSubmit(e, isMlkem));
    }

    function togglePasswordVisibility() {
      const input = document.getElementById("credentialInput");
      if (!input) return;
      input.type = (input.type === "password") ? "text" : "password";
    }

    function handleKeyFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        document.getElementById("credentialInput").value = evt.target.result.trim();
      };
      reader.readAsText(file);
    }

    async function handleDecryptSubmit(e, isMlkem) {
      e.preventDefault();
      const cred = document.getElementById("credentialInput").value.trim();
      const statusArea = document.getElementById("decryptStatusArea");
      const btn = document.getElementById("btnDecryptDownload");

      if (!cred) {
        statusArea.innerHTML = `<div style="color:var(--accent-rose); font-size:0.82rem; margin-bottom:0.75rem;">Please enter the ${isMlkem ? 'cryptographic key' : 'password'}.</div>`;
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `⏳ Verifying & Decrypting...`;
      statusArea.innerHTML = `
        <div style="background:rgba(6, 182, 212, 0.08); border:1px solid rgba(6, 182, 212, 0.2); border-radius:var(--radius-md); padding:0.75rem; margin-bottom:1rem; font-size:0.8rem; color:var(--pqc-cyan); text-align:center;">
          ⚡ Authenticating & unwrapping AES-256-GCM encryption key...
        </div>
      `;

      try {
        let res;
        if (isStatelessMode && fragmentBundle) {
          res = await fetch("/api/links/decrypt-bundle", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ bundle: fragmentBundle, credential: cred }),
          });
        } else {
          res = await fetch(`/api/links/${shareToken}/decrypt`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ credential: cred }),
          });

          // Self-healing fallback: If server returns 404 (container reset), retry with bundle
          if (!res.ok && res.status === 404 && fragmentBundle) {
            res = await fetch("/api/links/decrypt-bundle", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ bundle: fragmentBundle, credential: cred }),
            });
          }
        }

        if (!res.ok) {
          const err = await res.json();
          let msg = err.detail || "Decryption failed.";
          const lower = msg.toLowerCase();
          if (lower.includes("expired")) {
            msg = "⏰ This secure link has expired. Please ask the sender to create a new link.";
          } else if (lower.includes("limit") || lower.includes("reach")) {
            msg = "🚫 Maximum download limit for this link has been reached.";
          } else if (lower.includes("revok")) {
            msg = "🚫 This link has been revoked by the file owner.";
          } else if (lower.includes("key") || lower.includes("credential") || lower.includes("mismatch") || lower.includes("tag") || lower.includes("invalid") || lower.includes("password")) {
            msg = isMlkem ? "🔑 Invalid cryptographic private key! Please verify your key file." : "🔑 Incorrect password! Please check the password and try again.";
          }
          throw new Error(msg);
        }

        const data = await res.json();

        statusArea.innerHTML = `
          <div style="background:rgba(16, 185, 129, 0.1); border:1px solid rgba(16, 185, 129, 0.3); border-radius:var(--radius-md); padding:0.85rem; margin-bottom:1rem; font-size:0.82rem;">
            <div style="color:var(--accent-emerald); font-weight:700; margin-bottom:0.25rem;">
              ✓ ${isMlkem ? 'Decryption Succeeded & SHA-256 Verified' : 'Password Verified! File Decrypted'}
            </div>
            <div style="font-size:0.75rem; color:var(--text-muted);">
              Payload verified in ${data.total_time_ms || data.decrypt_time_ms} ms • Checksum: <code style="color:var(--accent-emerald);">${data.calculated_sha256.substring(0, 16)}...</code>
            </div>
          </div>
        `;

        // Direct browser file download
        downloadBinaryFile(data.filename, data.file_data_b64, data.mime_type);
        btn.innerHTML = `✓ Downloaded (Click to Re-Download)`;
        btn.disabled = false;
      } catch (err) {
        statusArea.innerHTML = `
          <div style="background:rgba(244, 63, 94, 0.1); border:1px solid rgba(244, 63, 94, 0.3); border-radius:var(--radius-md); padding:0.85rem; margin-bottom:1rem; font-size:0.82rem; color:var(--accent-rose);">
            ${isMlkem ? '🚫 <strong>Decryption Error:</strong>' : '🚫 <strong>Access Denied:</strong>'}<br>
            ${escapeHtml(err.message)}
          </div>
        `;
        btn.disabled = false;
        btn.innerHTML = isMlkem ? `🔓 Decrypt & Download File` : `🔓 Unlock & Download File`;
      }
    }

    function downloadBinaryFile(filename, b64Data, mimeType) {
      const byteChars = atob(b64Data);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) {
        byteNumbers[i] = byteChars.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: mimeType || "application/octet-stream" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(link.href), 5000);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
