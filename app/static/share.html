<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QSafeShare — Secure File Access</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    .share-container {
      max-width: 620px;
      margin: 4rem auto;
      padding: 0 1.5rem;
    }
    .share-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 2.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), var(--shadow-glow);
    }
    .share-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .file-preview-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 1.25rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .file-icon-large {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: rgba(6, 182, 212, 0.15);
      border: 1px solid rgba(6, 182, 212, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      flex-shrink: 0;
    }
    .verification-steps {
      margin-top: 1rem;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
  </style>
</head>
<body>

  <header>
    <div class="header-container">
      <div class="brand">
        <a href="/" style="text-decoration:none; display:flex; align-items:center; gap:0.75rem;">
          <div class="brand-icon">⚛️</div>
          <div>
            <span class="brand-title">QSafeShare</span>
            <span class="brand-badge">NIST FIPS 203</span>
          </div>
        </a>
      </div>
      <div>
        <a href="/" class="btn btn-secondary btn-sm">Workspace Dashboard →</a>
      </div>
    </div>
  </header>

  <main class="share-container">
    <div class="share-box" id="shareBoxContainer">
      <div style="text-align:center; padding:2rem;">
        <div style="font-size:2rem; margin-bottom:1rem;">⏳</div>
        <p style="color:var(--pqc-cyan);">Loading secure link metadata...</p>
      </div>
    </div>
  </main>

  <script>
    const shareToken = window.location.pathname.split("/share/")[1]?.split("?")[0]?.split("#")[0];

    // Check if key is passed in URL fragment (e.g. #key=...)
    let fragmentKey = "";
    if (window.location.hash && window.location.hash.includes("key=")) {
      fragmentKey = decodeURIComponent(window.location.hash.split("key=")[1].split("&")[0]);
    }

    document.addEventListener("DOMContentLoaded", async () => {
      if (!shareToken) {
        renderError("Invalid link format.");
        return;
      }
      await loadLinkInfo();
    });

    async function loadLinkInfo() {
      const container = document.getElementById("shareBoxContainer");
      try {
        const res = await fetch(`/api/links/${shareToken}/info`);
        if (!res.ok) {
          const err = await res.json();
          renderError(err.detail || "Link not found or expired.");
          return;
        }

        const info = await res.json();
        renderLinkPage(info);
      } catch (err) {
        renderError(err.message);
      }
    }

    function formatBytes(bytes) {
      if (!bytes) return "0 B";
      const k = 1024;
      const sizes = ["Bytes", "KB", "MB", "GB"];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
    }

    function renderError(message) {
      const container = document.getElementById("shareBoxContainer");
      container.innerHTML = `
        <div style="text-align:center; padding:1.5rem;">
          <div style="font-size:3rem; margin-bottom:0.75rem;">🚫</div>
          <h3 style="color:var(--accent-rose); margin-bottom:0.5rem;">Secure Access Denied</h3>
          <p style="color:var(--text-muted); font-size:0.9rem; margin-bottom:1.5rem;">${message}</p>
          <a href="/" class="btn btn-secondary">Return to QSafeShare</a>
        </div>
      `;
    }

    function renderLinkPage(info) {
      const container = document.getElementById("shareBoxContainer");

      if (!info.is_valid) {
        renderError(`Access Denied: ${info.reason}`);
        return;
      }

      const isMlkem = info.protection_mode === "ML_KEM";
      const keyLabel = isMlkem 
        ? "Post-Quantum ML-KEM-768 Private Key" 
        : "Cryptographic Passphrase / Secret Key";

      const keyPlaceholder = isMlkem
        ? "-----BEGIN PRIVATE KEY-----\nPaste your ML-KEM private key here..."
        : "Enter secret passphrase (e.g. PQC-...)";

      container.innerHTML = `
        <div class="share-header">
          <h2 style="font-size:1.35rem; font-weight:700; margin-bottom:0.25rem;">QSafeShare — Secure File Access</h2>
          <p style="font-size:0.8rem; color:var(--text-dim);">Protected with Post-Quantum Hybrid Envelope Encryption</p>
        </div>

        <div class="file-preview-card">
          <div class="file-icon-large">📄</div>
          <div style="flex-grow:1; min-width:0;">
            <div style="font-weight:700; font-size:1rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">
              ${escapeHtml(info.filename)}
            </div>
            <div style="font-size:0.78rem; color:var(--text-dim); display:flex; gap:0.75rem; margin-top:0.25rem;">
              <span>Size: ${formatBytes(info.file_size)}</span>
              <span>•</span>
              <span class="badge badge-pqc" style="font-size:0.68rem;">AES-256-GCM + ${info.kem_algorithm || 'ML-KEM-768'}</span>
            </div>
          </div>
        </div>

        <form id="decryptLinkForm">
          <div class="form-group">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.4rem;">
              <label style="font-size:0.82rem; font-weight:600; color:var(--text-main); margin-bottom:0;">
                🔐 ${keyLabel}
              </label>
              <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('keyFileInput').click()" style="font-size:0.75rem; padding:0.2rem 0.5rem;">
                📁 Upload Key File
              </button>
              <input type="file" id="keyFileInput" style="display:none;" accept=".pem,.key,.txt" onchange="handleKeyFileSelect(event)">
            </div>

            ${isMlkem 
              ? `<textarea id="credentialInput" class="form-control" rows="4" style="font-family:var(--font-mono); font-size:0.78rem;" placeholder="${keyPlaceholder}" required>${escapeHtml(fragmentKey)}</textarea>`
              : `<input type="text" id="credentialInput" class="form-control" style="font-family:var(--font-mono);" placeholder="${keyPlaceholder}" value="${escapeHtml(fragmentKey)}" required>`
            }
            <div style="font-size:0.72rem; color:var(--text-dim); margin-top:0.35rem;">
              Without the exact cryptographic key, the server and recipient cannot decrypt the file payload.
            </div>
          </div>

          <div id="decryptStatusArea"></div>

          <button type="submit" id="btnDecryptDownload" class="btn btn-primary" style="width:100%; padding:0.75rem; font-size:0.92rem; margin-top:0.5rem;">
            🔓 Decrypt & Download File
          </button>
        </form>
      `;

      document.getElementById("decryptLinkForm").addEventListener("submit", handleDecryptSubmit);
    }

    function handleKeyFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        document.getElementById("credentialInput").value = evt.target.result.trim();
      };
      reader.readAsText(file);
    }

    async function handleDecryptSubmit(e) {
      e.preventDefault();
      const cred = document.getElementById("credentialInput").value.trim();
      const statusArea = document.getElementById("decryptStatusArea");
      const btn = document.getElementById("btnDecryptDownload");

      if (!cred) {
        statusArea.innerHTML = `<div style="color:var(--accent-rose); font-size:0.82rem; margin-bottom:0.75rem;">Please provide the cryptographic decryption key.</div>`;
        return;
      }

      btn.disabled = true;
      btn.innerHTML = `⏳ Verifying with Policy Agent & Decrypting...`;
      statusArea.innerHTML = `
        <div style="background:rgba(6, 182, 212, 0.08); border:1px solid rgba(6, 182, 212, 0.2); border-radius:var(--radius-md); padding:0.85rem; margin-bottom:1rem; font-size:0.82rem;">
          <div style="color:var(--pqc-cyan); margin-bottom:0.25rem;">⚡ Executing Cryptographic Pipeline:</div>
          <div style="color:var(--text-muted); font-size:0.75rem; line-height:1.5;">
            1. Verifying authorization with Policy Agent...<br>
            2. Performing post-quantum decapsulation & AES-256-GCM unwrap...<br>
            3. Verifying SHA-256 bit integrity...
          </div>
        </div>
      `;

      try {
        const res = await fetch(`/api/links/${shareToken}/decrypt`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ credential: cred }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || "Decryption failed.");
        }

        const data = await res.json();

        statusArea.innerHTML = `
          <div style="background:rgba(16, 185, 129, 0.1); border:1px solid rgba(16, 185, 129, 0.3); border-radius:var(--radius-md); padding:0.85rem; margin-bottom:1rem; font-size:0.82rem;">
            <div style="color:var(--accent-emerald); font-weight:700; margin-bottom:0.25rem;">
              ✓ Decryption Succeeded & SHA-256 Verified
            </div>
            <div style="font-size:0.75rem; color:var(--text-muted);">
              Key unwrapped in ${data.unwrap_time_ms} ms • Payload decrypted in ${data.decrypt_time_ms} ms<br>
              SHA-256 Checksum: <code style="color:var(--accent-emerald);">${data.calculated_sha256.substring(0, 24)}...</code>
            </div>
          </div>
        `;

        // Direct browser file download
        downloadBinaryFile(data.filename, data.file_data_b64, data.mime_type);
        btn.innerHTML = `✓ File Downloaded (Click to Re-Download)`;
        btn.disabled = false;
      } catch (err) {
        statusArea.innerHTML = `
          <div style="background:rgba(244, 63, 94, 0.1); border:1px solid rgba(244, 63, 94, 0.3); border-radius:var(--radius-md); padding:0.85rem; margin-bottom:1rem; font-size:0.82rem; color:var(--accent-rose);">
            🚫 <strong>Access / Decryption Error:</strong><br>
            ${escapeHtml(err.message)}
          </div>
        `;
        btn.disabled = false;
        btn.innerHTML = `🔓 Decrypt & Download File`;
      }
    }

    function downloadBinaryFile(filename, b64Data, mimeType) {
      const byteChars = atob(b64Data);
      const byteNumbers = new Array(byteChars.length);
      for (let i = 0; i < byteChars.length; i++) {
        byteNumbers[i] = byteChars.charCodeAt(i);
      }
      const byteArray = new Uint8Array(byteNumbers);
      const blob = new Blob([byteArray], { type: mimeType || "application/octet-stream" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(link.href), 5000);
    }

    function escapeHtml(str) {
      if (!str) return "";
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }
  </script>
</body>
</html>
